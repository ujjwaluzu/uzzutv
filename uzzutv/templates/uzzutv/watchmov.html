{% extends 'uzzutv/layout.html' %}
{% load static %}

{% block body %}

<style>

body{
    background:#111111 !important;
    margin:0;
    font-family: "Inter", sans-serif;
    color:white;
}

/* Container */

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

/* Title */

.video-title{
    font-size:24px;
    margin-bottom:15px;
    font-weight:600;
    padding-top:30px;
}

/* Player wrapper */

.player{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:12px;
    overflow:hidden;
    background:#000;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

/* iframe */

.player iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
}

/* Tablet */

@media (max-width: 900px){

.video-title{
    font-size:20px;
}

}

/* Mobile */

@media (max-width: 600px){

.container{
    padding:10px;
    display:flex;
    flex-direction:column;
    align-items:center;   /* ✅ centers player */
    margin-top: 200px;
}

.video-title{
    font-size:18px;
    text-align:center;   /* ✅ center title */
}

/* Make player slightly smaller + centered */

.player{
    width:100%;
    max-width:100%;
}

}
.video-title{
margin-bottom:20px;
}


/* Server Section */

.server-section{
    max-width:960px;
    margin:10px auto 0;
    padding:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    backdrop-filter:blur(6px);
}

.server-title{
    font-size:16px;
    font-weight:600;
    color:#e5e7eb;
    margin:0 0 14px;
    letter-spacing:0.01em;
}

.server-title::after{
    content:" \00B7 switch anytime";
    color:#6b7280;
    font-weight:400;
    font-size:13px;
}

/* Buttons */

.server-list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:10px;
}

.server-btn{
    padding:12px 16px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:#1c222b;
    color:#cbd5e1;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    transition:all 0.2s ease;
}

.server-btn:hover{
    background:#242c38;
    border-color:rgba(255,255,255,0.16);
    color:#ffffff;
    transform:translateY(-1px);
}

.server-btn:active{
    transform:translateY(0);
}

/* Active server */

.server-btn.active{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.22);
    color:#ffffff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08), 0 6px 18px rgba(0,0,0,0.35);
}

.server-btn.active:hover{
    background:rgba(255,255,255,0.17);
}

/* Tablet */

@media (max-width:900px){

.server-list{
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
}

}

/* Mobile */

@media (max-width:600px){
.server-section{
    margin-top:16px;
    margin-left:14px;
    margin-right:14px;
    padding:12px;
}

.server-list{
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
}

.server-btn{
    padding:11px 8px;
    font-size:13px;
}

}
</style>

<div class="container">

<h1 class="video-title">{{title}}</h1>

<div class="player">

<iframe id="player" src="{{url}}"
frameborder="0"
allowfullscreen
allow="encrypted-media">
</iframe>

</div>

</div>


<div class="server-section">

<h3 class="server-title">Servers</h3>

<div class="server-list">

<button class="server-btn active"
onclick="changeServer('{{url}}', this)">
Vidking
</button>

<button class="server-btn"
onclick="changeServer('{{url2}}', this)">
Vidnest
</button>

<button class="server-btn"
onclick="changeServer('{{url3}}', this)">
Vidsrc
</button>

<button class="server-btn"
onclick="changeServer('{{url4}}', this)">
Vidfast
</button>

<button class="server-btn"
onclick="changeServer('{{url5}}', this)">
Videasy
</button>
</div>
</div>



<script>


function changeServer(url, btn){

// change iframe source
document.getElementById("player").src = url;

// remove active from all
document.querySelectorAll(".server-btn").forEach(b => {
    b.classList.remove("active");
});

// add active to clicked
btn.classList.add("active");

}

</script>

{% endblock %}
