  <circle cx="448" cy="364" r="20" fill="#29292f"/><path d="M448 353v16m-8-9v4a8 8 0 0 0 16 0v-4m-8 12v7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
