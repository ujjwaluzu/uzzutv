{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Aniuzu — Discover Anime{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Aniuzu is a anime discovery platform powered by AniList. Track trending, popular and currently airing anime.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://s4.anilist.co">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'aniuzu/css/aniuzu.css' %}">
  <link rel="icon" type="image/x-icon" href="https://img.icons8.com/?size=100&id=dpUQB4dX6yQC&format=png&color=000000">
  {% block extra_head %}{% endblock %}
</head>
<body>

<header class="az-nav">
  <div class="az-nav-inner">
    <a class="az-brand" href="{% url 'aniuzu:home' %}">ANI<span>ZU</span></a>

    <nav class="az-links" id="az-links">
      <a class="az-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'aniuzu:home' %}">Home</a>
      <a class="az-link {% if request.resolver_match.url_name == 'trending' %}active{% endif %}" href="{% url 'aniuzu:trending' %}">Trending</a>
      <a class="az-link {% if request.resolver_match.url_name == 'popular' %}active{% endif %}" href="{% url 'aniuzu:popular' %}">Popular</a>
      <a class="az-link {% if request.resolver_match.url_name == 'airing' %}active{% endif %}" href="{% url 'aniuzu:airing' %}">Airing</a>
    </nav>

    <form class="az-search" method="get" action="{% url 'aniuzu:search' %}">
      <input type="search" name="q" value="{{ query|default:'' }}" placeholder="Search anime…" aria-label="Search anime">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </form>

    <button class="az-burger" id="az-burger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="az-main">
{% block body %}{% endblock %}
</main>

<footer class="az-footer">
  <span>© 2026 ANIUZU</span>
  <span class="az-footer-meta">Anime data by <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a></span>
</footer>

<script>
(function () {
  var burger = document.getElementById('az-burger');
  var links = document.getElementById('az-links');
  if (!burger || !links) return;
  burger.addEventListener('click', function () {
    var open = links.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
{% block extra_scripts %}{% endblock %}
</body>

</html>
